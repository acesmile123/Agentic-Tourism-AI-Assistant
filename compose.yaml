name: tourism-ai

services:
  migrate:
    build: .
    image: tourism-ai-backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://tourism:${POSTGRES_PASSWORD:-tourism}@postgres:5432/tourism
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    image: tourism-ai-backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://tourism:${POSTGRES_PASSWORD:-tourism}@postgres:5432/tourism
      REDIS_MEMORY_URL: redis://redis:6379/0
      REDIS_CACHE_URL: redis://redis:6379/1
      REDIS_RATE_LIMIT_URL: redis://redis:6379/2
      MCP_SERVER_URL: http://mcp:8001/mcp
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mcp:
        condition: service_healthy
    restart: unless-stopped

  mcp:
    build: .
    image: tourism-ai-backend
    command: ["python", "-m", "tourism_agent.mcp.server"]
    env_file: .env
    environment:
      REDIS_CACHE_URL: redis://redis:6379/1
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8001
    ports:
      - "8001:8001"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1',8001),2); s.close()"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tourism
      POSTGRES_USER: tourism
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tourism}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tourism -d tourism"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
