name: tourism-ai-production

services:
  migrate:
    image: ${APP_IMAGE:?Set APP_IMAGE to the pushed container image}
    env_file: .env.production
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    image: ${APP_IMAGE:?Set APP_IMAGE to the pushed container image}
    env_file: .env.production
    environment:
      MCP_SERVER_URL: http://mcp:8001/mcp
      TRUSTED_PROXY_HEADERS: "true"
    depends_on:
      mcp:
        condition: service_healthy
    expose:
      - "8000"
    restart: unless-stopped

  web:
    image: ${FRONTEND_IMAGE:?Set FRONTEND_IMAGE to the pushed frontend image}
    expose:
      - "80"
    restart: unless-stopped

  mcp:
    image: ${APP_IMAGE:?Set APP_IMAGE to the pushed container image}
    env_file: .env.production
    command: ["python", "-m", "tourism_agent.mcp.server"]
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8001"
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1',8001),2); s.close()"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/tourism.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_started
      web:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
